name: Sync Upstream and Release

# Every 3 hours: fast-forward this fork's main from upstream, then check whether
# upstream has published a release this fork has not built yet. If so, build
# that release's tag and publish the Android APKs and the Windows installer.
#
# Keyed on upstream *releases* rather than commits, so intermediate commits on
# upstream main do not each trigger a build.

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: Rebuild the latest upstream release even if it was already published here
        default: false
        type: boolean

concurrency:
  group: sync-upstream-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPSTREAM_REPO: edde746/plezy
  # Android applicationId these APKs are built under. Overridden from the
  # upstream com.edde746.plezy because Honor's Histen "Premium Bass" effect is
  # gated on a per-package allowlist, and this ID is on it. Consequences, all
  # accepted deliberately: this APK cannot be installed alongside the real
  # KuWo Music, cannot go to Play, and — being signed with a different key —
  # can never install over or masquerade as an update to the real app.
  ANDROID_APPLICATION_ID: "cn.kuwo.player"
  # Keep in step with build.yml's FLUTTER_VERSION.
  FLUTTER_VERSION: "3.44.0"
  # Fork builds get no Sentry DSN and no symbol upload, so obfuscation and
  # split debug info are left off to keep crash traces readable.
  RELEASE_DART_DEFINES: --dart-define=ENABLE_UPDATE_CHECK=true --dart-define=ENABLE_DONATIONS=true --dart-define=SENTRY_ENVIRONMENT=github
  SYNC_BUILD_CACHE_VERSION: sync-build-v1

jobs:
  check-upstream:
    name: Sync main and check for a new upstream release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      build: ${{ steps.release.outputs.build }}
      tag: ${{ steps.release.outputs.tag }}
      tag_sha: ${{ steps.release.outputs.tag_sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Require the protected main branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Upstream sync may only run from refs/heads/main." >&2
            exit 1
          fi

      # Credentials are intentionally persisted: this job pushes the merged main
      # back to the fork.
      #
      # GITHUB_TOKEN cannot push a commit that adds or changes anything under
      # .github/workflows/, and there is no `permissions:` key that grants it --
      # the restriction is structural. Upstream edits its workflows regularly,
      # so the sync push will eventually be rejected. Set a SYNC_PAT secret (a
      # PAT or fine-grained token with the `workflow` scope) to make those syncs
      # go through; without it everything still works until upstream next
      # touches a workflow file.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # A real merge, not --ff-only: this fork permanently carries its own
      # commits (these workflows and .github/actions), so it is *always*
      # divergent from upstream by design. Git fast-forwards on its own whenever
      # that is actually possible, so this stays linear when the fork is clean.
      - name: Merge upstream into main
        run: |
          set -euo pipefail

          # Runners check out fresh, but stay re-runnable anyway.
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          else
            git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          fi

          # Only main. The one release tag that matters is fetched by name in
          # the next step, once the API has said which one it is.
          git fetch --no-tags upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "main already contains every upstream commit."
          elif git merge --no-edit upstream/main; then
            echo "Merged upstream/main into main."
            git push origin main
          else
            # Leave the branch untouched so the conflict is resolved by a human
            # rather than guessed at here.
            git merge --abort
            echo "ERROR: merging ${UPSTREAM_REPO} into main hit a conflict." >&2
            echo "Resolve it locally and push, then re-run this workflow." >&2
            exit 1
          fi

          # Upstream tags are fetched locally (above) but deliberately NOT
          # pushed. GITHUB_TOKEN may not create a ref that introduces
          # .github/workflows/ files, and every upstream tag points at a tree
          # containing them, so `git push --tags` is always rejected. It is also
          # unnecessary: upstream cuts releases by committing the version bump
          # to main and tagging it there, so merging main already makes the
          # release commit reachable. The release job's own tag is created
          # through the Releases API, which is not subject to that restriction.

      - name: Check for an unbuilt upstream release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_BUILD: ${{ inputs.force_build }}
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          set -euo pipefail

          # /releases/latest excludes drafts and prereleases.
          tag=$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq .tag_name)
          if [[ -z "$tag" || "$tag" == "null" ]]; then
            echo "Upstream has no published release." >&2
            exit 1
          fi
          echo "Latest upstream release: $tag"

          # Exactly the one tag this run is about, by name.
          if ! git fetch --no-tags upstream "refs/tags/${tag}:refs/tags/${tag}"; then
            echo "ERROR: could not fetch tag ${tag} from ${UPSTREAM_REPO}." >&2
            exit 1
          fi

          if ! tag_sha=$(git rev-parse -q --verify "refs/tags/${tag}^{commit}"); then
            echo "ERROR: tag ${tag} did not resolve to a commit." >&2
            exit 1
          fi

          # The build jobs fetch this commit from the fork, so it has to be
          # reachable from a pushed ref. Merging upstream/main normally puts it
          # on main; if upstream ever tags off-main it would not be, and that
          # should fail here rather than as an opaque checkout error later.
          if ! git merge-base --is-ancestor "$tag_sha" HEAD; then
            echo "ERROR: ${tag} (${tag_sha}) is not an ancestor of main after syncing." >&2
            echo "Upstream appears to have tagged off-main; this workflow cannot fetch that commit." >&2
            exit 1
          fi

          # A release already published here means this tag was built before.
          # Checked against releases rather than tags: the release job creates
          # the tag, so a tag check would race its own bookkeeping.
          build=true
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists in this fork."
            build=false
          fi

          if [[ "$build" != "true" && "$FORCE_BUILD" == "true" ]]; then
            echo "Already built, but force_build was requested."
            build=true
          fi

          # Fail here rather than after ~30 minutes of Android and Windows
          # builds. Publishing the release creates tag ${tag} at a commit whose
          # tree contains .github/workflows/, and GITHUB_TOKEN is structurally
          # incapable of that: `workflows` is not a grantable permission, so no
          # repository setting can enable it.
          if [[ "$build" == "true" && -z "${SYNC_PAT}" ]]; then
            echo "ERROR: ${tag} needs building, but the SYNC_PAT secret is not set." >&2
            echo "Create a token with the 'workflow' scope (classic PAT: repo + workflow;" >&2
            echo "fine-grained: Contents write + Workflows write) and add it as SYNC_PAT." >&2
            exit 1
          fi

          # Feeds the Windows installer's -Version; an empty value would
          # silently produce a mis-versioned installer.
          version=$(git show "${tag}:pubspec.yaml" | sed -n 's/^version: \(.*\)+.*/\1/p')
          if [[ -z "$version" ]]; then
            echo "ERROR: could not read a version from pubspec.yaml at ${tag}." >&2
            exit 1
          fi

          {
            echo "build=$build"
            echo "tag=$tag"
            echo "tag_sha=$tag_sha"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Summarize
        run: |
          {
            echo "### Upstream release check"
            echo ""
            echo "- Upstream: \`${UPSTREAM_REPO}\`"
            echo "- Latest release: \`${{ steps.release.outputs.tag }}\`"
            echo "- Commit: \`${{ steps.release.outputs.tag_sha }}\`"
            echo "- Building: \`${{ steps.release.outputs.build }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build-android:
    name: Build Android (APK)
    needs: check-upstream
    if: ${{ needs.check-upstream.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      apk_suffix: ${{ steps.appid.outputs.apk-suffix }}
    steps:
      # Builds the release tag, not main: upstream main may already have moved
      # past the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.check-upstream.outputs.tag_sha }}
          persist-credentials: false

      # `uses: ./...` resolves against the workspace, and the workspace is now an
      # upstream commit that has never contained this fork's .github/actions. The
      # tooling is checked out beside it instead. Composite action steps still
      # run with the workspace root as their working directory, so the action
      # edits the tag's android/ sources as intended.
      - name: Check out fork tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          path: .fork-tooling
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: "${{ env.SYNC_BUILD_CACHE_VERSION }}-flutter-:os:-:channel:-:version:-:arch:-:hash:"
          pub-cache: false

      - name: Cache Pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.pub-cache
          key: ${{ env.SYNC_BUILD_CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-pub-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ env.SYNC_BUILD_CACHE_VERSION }}-${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile --no-example

      - name: Set Android application ID
        id: appid
        uses: ./.fork-tooling/.github/actions/set-android-application-id
        with:
          application-id: ${{ env.ANDROID_APPLICATION_ID }}
          apk-suffix: honor-packed

      # android/app/build.gradle.kts falls back to debug signing when
      # key.properties is absent, so an unconfigured fork still gets APKs.
      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set; building with debug signing."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties << EOF
          storePassword=${ANDROID_STORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=upload-keystore.jks
          EOF

      - name: Build APKs
        run: flutter build apk --release --split-per-abi ${{ env.RELEASE_DART_DEFINES }} --dart-define=GIT_COMMIT=${{ needs.check-upstream.outputs.tag_sha }} --dart-define=SENTRY_DIST=github-android-apk

      - name: Clean up keystore
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - name: Package APKs
        env:
          APK_SUFFIX: ${{ steps.appid.outputs.apk-suffix }}
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" \
               "plezy-android-${abi}${APK_SUFFIX}.apk"
          done
          ls -l plezy-android-*.apk

      - name: Upload APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-apk
          path: plezy-android-*.apk

  build-windows:
    name: Build Windows (x64 installer)
    needs: check-upstream
    if: ${{ needs.check-upstream.outputs.build == 'true' }}
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.check-upstream.outputs.tag_sha }}
          persist-credentials: false

      - name: Cache Windows native dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/windows/x64/_deps
          key: ${{ env.SYNC_BUILD_CACHE_VERSION }}-windows-native-x64-${{ hashFiles('windows/CMakeLists.txt') }}

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: "${{ env.SYNC_BUILD_CACHE_VERSION }}-flutter-:os:-:channel:-:version:-:arch:-:hash:"
          pub-cache: false

      - name: Cache Pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~\AppData\Local\Pub\Cache
          key: ${{ env.SYNC_BUILD_CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-pub-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}

      - name: Install dependencies
        shell: pwsh
        run: flutter pub get --enforce-lockfile --no-example

      - name: Install patched Flutter engine (DComp)
        shell: pwsh
        run: |
          flutter precache --windows
          .\windows\tool\install-patched-engine.ps1

      - name: Build Windows x64
        shell: pwsh
        run: flutter build windows --release ${{ env.RELEASE_DART_DEFINES }} --dart-define=GIT_COMMIT=${{ needs.check-upstream.outputs.tag_sha }} --dart-define=SENTRY_DIST=github-windows-x64

      # Single-arch mode: emits an x64-only setup .exe next to the portable .7z.
      - name: Build installer
        shell: pwsh
        run: .\windows\build-installer.ps1 -X64BuildDir "build\windows\x64\runner\Release" -Version "${{ needs.check-upstream.outputs.version }}"

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-installer
          path: plezy-windows-installer.exe

  release:
    name: Publish release
    needs: [check-upstream, build-android, build-windows]
    if: ${{ needs.check-upstream.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      # Tagged with the upstream release tag: that is the key the next run's
      # "already built?" check looks for, so it must be created here.
      #
      # Needs SYNC_PAT, not GITHUB_TOKEN. Publishing this release creates the
      # tag ref, and that commit's tree contains .github/workflows/ -- the same
      # thing GITHUB_TOKEN is barred from doing on a git push. The Releases API
      # reports it as a bare 403 "Resource not accessible by integration"
      # instead of naming the workflow scope, which makes it look like a
      # missing `contents: write`; the job has that, and it is not the cause.
      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ needs.check-upstream.outputs.tag }}
          target_commitish: ${{ needs.check-upstream.outputs.tag_sha }}
          name: Plezy ${{ needs.check-upstream.outputs.tag }}
          body: |
            Automated build of [`${{ env.UPSTREAM_REPO }}` ${{ needs.check-upstream.outputs.tag }}](https://github.com/${{ env.UPSTREAM_REPO }}/releases/tag/${{ needs.check-upstream.outputs.tag }}), built at commit ${{ needs.check-upstream.outputs.tag_sha }}.

            - **Android** — install the `.apk` matching your device ABI, `arm64-v8a` unless you know otherwise. Built under applicationId `${{ env.ANDROID_APPLICATION_ID }}`, so it cannot be installed alongside an app already using that ID.
            - **Windows** — run `plezy-windows-installer.exe` (x64).
          files: |
            artifacts/android-apk/*.apk
            artifacts/windows-installer/plezy-windows-installer.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}

      # Skips itself rather than failing when the secrets are absent: a missing
      # notification should not mark an otherwise-good release as failed.
      - name: Notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TAG: ${{ needs.check-upstream.outputs.tag }}
          RELEASE_URL: ${{ steps.create_release.outputs.url }}
          APK_SUFFIX: ${{ needs.build-android.outputs.apk_suffix }}
        run: |
          set -euo pipefail

          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID not configured; skipping notification."
            exit 0
          fi

          text=$(printf '%s\n' \
            "🚀 <b>Plezy ${TAG}</b> is built" \
            "" \
            "Upstream release <code>${TAG}</code> was published and has been rebuilt for this fork." \
            "" \
            "• Android — 3 APKs (<code>${APK_SUFFIX}</code>), applicationId <code>${ANDROID_APPLICATION_ID}</code>" \
            "• Windows — <code>plezy-windows-installer.exe</code> (x64)" \
            "" \
            "${RELEASE_URL}")

          # --data-urlencode keeps the body off the command line, and the token
          # only ever reaches curl through the URL built from the masked env var.
          curl --fail-with-body -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=false" \
            -o /dev/null

          echo "Telegram notification sent."
